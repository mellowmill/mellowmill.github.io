<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;padding:0;background:#222;font-family:monospace;color:#fff}
  .row{display:flex;gap:12px;padding:12px;align-items:flex-start;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;align-items:center}
  .lbl{font-size:12px;padding:4px 8px;background:#333;margin-bottom:4px;border-radius:4px}
  iframe{border:1px solid #444;display:block;background:#fff}
</style>
</head>
<body>
<div class="row" id="row"></div>
<script>
  const url = new URL(location.href).searchParams.get('p') || '../index.html';
  const widths  = { mobile: 375,  tablet: 768,  desktop: 1280 };
  const row = document.getElementById('row');
  ['mobile','tablet','desktop'].forEach(k => {
    const col = document.createElement('div'); col.className = 'col';
    const lbl = document.createElement('div'); lbl.className='lbl';
    lbl.textContent = k + ' — ' + widths[k];
    const f = document.createElement('iframe');
    f.src = url; f.width = widths[k]; f.height = 12000;
    col.appendChild(lbl); col.appendChild(f); row.appendChild(col);
  });
</script>
</body>
</html>

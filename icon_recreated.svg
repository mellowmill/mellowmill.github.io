<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b7ed6"/>
      <stop offset="1" stop-color="#6a4caf"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#553a96"/>
      <stop offset="1" stop-color="#3a2470"/>
    </linearGradient>
    <linearGradient id="topFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f9fc"/>
    </linearGradient>
    <linearGradient id="bottomFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f5"/>
      <stop offset="1" stop-color="#cdd4de"/>
    </linearGradient>
    <linearGradient id="circleTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fafbfd"/>
    </linearGradient>
    <linearGradient id="circleBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f5f8"/>
      <stop offset="1" stop-color="#dde2e9"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="6" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="circleClipTop">
      <rect x="80" y="140" width="220" height="116"/>
    </clipPath>
    <clipPath id="circleClipBottom">
      <rect x="80" y="256" width="220" height="116"/>
    </clipPath>
  </defs>

  <!-- Squircle background -->
  <path fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="6" d="M256 70
    C 70 70, 16 110, 16 256
    C 16 402, 70 442, 256 442
    C 442 442, 496 402, 496 256
    C 496 110, 442 70, 256 70 Z"/>

  <g filter="url(#softShadow)" transform="translate(-20 0)">
    <!-- Arrow body: top (lit) half -->
    <path fill="url(#topFace)" d="
      M 190 256
      L 440 256
      L 310 178
      L 290 218
      L 220 240
      Z"/>

    <!-- Arrow body: bottom (shadowed) half -->
    <path fill="url(#bottomFace)" d="
      M 190 256
      L 440 256
      L 310 334
      L 290 294
      L 220 272
      Z"/>

    <!-- Circle: top lit half -->
    <circle cx="190" cy="256" r="78" fill="url(#circleTop)" clip-path="url(#circleClipTop)"/>
    <!-- Circle: bottom shaded half -->
    <circle cx="190" cy="256" r="78" fill="url(#circleBottom)" clip-path="url(#circleClipBottom)"/>

    <!-- Subtle crease highlight along center fold -->
    <path d="M 112 256 L 440 256" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>

    <!-- Inner fold lines -->
    <path d="M 290 218 L 310 178" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    <path d="M 290 294 L 310 334" stroke="#000000" stroke-width="1" opacity="0.08"/>
  </g>
</svg>

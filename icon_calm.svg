<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2EFE9"/>
    </linearGradient>

    <radialGradient id="hi" cx="0.32" cy="0.28" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="shadow"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="none" stroke="#E8E1D2" stroke-width="2"/>

  <g filter="url(#drop)">
    <g>
      <circle cx="160" cy="140" r="26" fill="#2B6FE8" fill-opacity="0.82"/>
      <circle cx="215" cy="169" r="26" fill="#1F8FDC" fill-opacity="0.82"/>
      <circle cx="270" cy="198" r="26" fill="#13ABC2" fill-opacity="0.82"/>
      <circle cx="325" cy="227" r="26" fill="#16C29A" fill-opacity="0.82"/>
      <circle cx="380" cy="256" r="26" fill="#2ECC55" fill-opacity="0.85"/>
      <circle cx="325" cy="285" r="26" fill="#16C29A" fill-opacity="0.82"/>
      <circle cx="270" cy="314" r="26" fill="#13ABC2" fill-opacity="0.82"/>
      <circle cx="215" cy="343" r="26" fill="#1F8FDC" fill-opacity="0.82"/>
      <circle cx="160" cy="372" r="26" fill="#2B6FE8" fill-opacity="0.82"/>
    </g>

    <g>
      <circle cx="160" cy="140" r="26" fill="url(#hi)"/>
      <circle cx="215" cy="169" r="26" fill="url(#hi)"/>
      <circle cx="270" cy="198" r="26" fill="url(#hi)"/>
      <circle cx="325" cy="227" r="26" fill="url(#hi)"/>
      <circle cx="380" cy="256" r="26" fill="url(#hi)"/>
      <circle cx="325" cy="285" r="26" fill="url(#hi)"/>
      <circle cx="270" cy="314" r="26" fill="url(#hi)"/>
      <circle cx="215" cy="343" r="26" fill="url(#hi)"/>
      <circle cx="160" cy="372" r="26" fill="url(#hi)"/>
    </g>
  </g>
</svg>
